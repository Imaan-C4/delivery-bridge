modules:
  jira:issuePanel:
    - key: delivery-bridge-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: delivery-bridge
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  trigger:
    - key: issue-status-trigger
      function: issueStatusHandler
      events:
        - avi:jira:updated:issue

  function:
    - key: resolver
      handler: index.handler

    - key: issueStatusHandler
      handler: index.issueStatusHandler

resources:
  - key: main
    path: src/frontend/index.jsx

permissions:
  scopes:
    - read:jira-work
    - write:jira-work

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/27f95203-5331-435e-9992-2a3f22e37b20